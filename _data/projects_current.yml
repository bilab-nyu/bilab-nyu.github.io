- title: "Smart safety in roadway work zones using intelligent wearable alarms"
  image: prj7_worker_safety.png
  addr: work-zone-safety
  description: "The most recent statistics in the United States are showing an increasing rate of construction worker fatalities due to vehicles crashing into roadway work zones, peaking at over 900 deaths in 2021. Research in transportation safety has mainly investigated these accidents in relation to the behavior and awareness of vehicle motorists, leaving the role of roadway workers' behavior not well understood. Meanwhile, recent commercial roadway work zone intrusion alert (WZIA) systems have been deployed to raise alarms (e.g., sounds, flashing lights) to warn workers of traffic hazards (e.g., speeding car) and prevent accidents, but suffer from slow worker response times the farther away they stand from a WZIA's stationary alarm source (e.g., loudspeaker/lamp). Wearable warning devices (e.g., smartwatch) have the potential to address the limitations of current WZIA systems by ensuring workers always perceive alarms on their bodies. As wearable warning devices become adopted in roadway work zones, workers may still experience alarm fatigue due to repeated exposure to alarms of constant attribute-values, reducing their responsiveness towards traffic hazards over time. To address these challenges, prior research at BILAB initiated an integrated traffic and virtual reality (VR) platform that simulates realistic roadway work zones with surrounding traffic flow. Utilizing the platform to collect data on human roadway workers' behaviors and alarm reactions, the major contributions of this dissertation include: (1) a deep learning model that can accurately predict roadway workers' trajectory based on their construction activities and proximity to traffic vehicles, (2) a identified list of alarm attributes (e.g., modality) and values (e.g., “haptics and sounds”) that informs the design of future wearable warning devices for roadway worker safety applications, and (3) a reinforcement learning-based intelligent control system for fine-tuning alarm attribute-values to minimize alarm fatigue in worker reactions."
  pp:
    pp1: "Lu, D., & Ergan, S. (2025). Principal attributes of wearable warning alarms to promote roadway worker safety. *Advanced Engineering Informatics*, 67, 103481."
    pp2: "Lu, D., Ergan, S., & Ozbay, K. (2025). Reinforcement learning-based optimal control of wearable alarms for consistent roadway workers' reactions to traffic hazards. *Journal of Transportation Safety & Security*, 1-25. "
    pp3: "Lordianto, B., Lu, D., Ho, W., & Ergan, S. (2024). Hapti-met: A construction helmet with directional haptic feedback for roadway worker safety. 453-462. In: *EG-ICE 2024 International Conference on Intelligent Computing in Engineering*, Vigo, Spain, July, 2024."
    pp4: "Lu, D., & Ergan, S. (2023). Predicting roadway workers’ safety behaviour in short-term work zones. In: *EG-ICE 2023 International Conference on Intelligent Computing in Engineering*, London, United Kingdom, July, 2023. "
    pp5: "Qin, J., Lu, D., & Ergan, S. (2022). Towards increased situational awareness at unstructured work zones: Analysis of worker behavioral data captured in VR-based micro traffic simulations. 63-77. In: *International Conference on Computing in Civil and Building Engineering*, Cape Town, South Africa, October, 2022."
    pp6: "Zou, Z., Bernardes, S. D., Zuo, F., Ergan, S., and Ozbay, K. (2022) Developing an integrated platform to enable hardware-in-the-loop for synchronous VR, traffic simulation and sensor interactions, *Advanced Engineering Informatics*, 51, 101476 "
  highlight: 1

- title: "AI-powered and robot-assisted manufacturing for modular construction: Train module assembly progress inference AI model training in virtual reality"
  image: prj8_kpark.png
  addr: arm4mod
  description: "Modular construction aims at overcoming challenges faced by the traditional construction process such as the shortage of skilled workers, fast-track project requirements, and cost associated with on-site productivity losses and recurrent rework. Since manufacturing is done off-site in controlled factory settings, modular construction is associated with increased productivity and better quality control. However, because every construction project is unique and results in distinct work pieces and building elements to be assembled, modular construction factories necessitate better mechanisms to assist workers during the assembly process in order to minimize errors in selecting the pieces to be assembled and idle times while figuring out the next step in an assembly sequence. Machine intelligence provides opportunities for such assistance; however, a challenge is to rapidly generate large datasets with rich contextual data to train such intelligent agents. This work overviews a mechanism to generate such datasets in virtual environments and evaluates the performance of AI models trained using data generated in virtual environments in recognizing the next installation step in modular assembly sequences. Performance of the trained MV-CNN models (with accuracy of 0.97) shows that virtual environments can potentially be used to generate the required datasets for AI without the costly, time-consuming, and labor-intensive investments needed upfront for capturing real-world data."
  pp:
    pp1: "Park, K., & Ergan, S. (2022). Toward intelligent agents to detect work pieces and processes in modular construction: An approach to generate synthetic training data. In Construction Research Congress 2022 (pp. 802-811)."
    pp2: "Park, K., Ergan, S., & Feng, C. (2021). Towards intelligent agents to assist in modular construction: evaluation of datasets generated in virtual environments for AI training. In ISARC. Proceedings of the International Symposium on Automation and Robotics in Construction (Vol. 38, pp. 327-333). IAARC Publications."
  highlight: 1

- title: "AI-based semantic generative design models for architectural layout design"
  image: prj9_kpark.png
  addr: ai-arch
  description: "|
  The prevailing construction of most residential homes today relies on standardized plans, often bypassing the expertise of professional architects who, in 2023, derived only 8% of their billings from the single-family residential sector. This exclusion of architectural design intelligence from the majority of mass housing projects is a significant concern, particularly considering that architect-designed homes have demonstrated up to 50% higher market values and typically offer enhanced internal environments and structural integrity. Furthermore, the quality of spatial design profoundly impacts occupants’ needs with respect to privacy expectations per room type as well as their well-being, with poorly optimized layouts negatively affecting occupants’ expectations and experience. Existing tools fail to address these expectations. In addition, given that urban residents spend as much as 90% of their time indoors, the thoughtful design of architectural layouts becomes critical for occupant satisfaction and well-being. The overarching problem domain of this research lies in advancing computational methods for human-centric architectural design, where current tools often fall short of fully capturing the complexities of creating spaces that are both functionally effective and supportive of human well-being.
  
  Specific challenges are as the following: (1) Current computational design tools in architecture, particularly state-of-the-art deep learning models (e.g., GANs), struggle to fully align with implicit architectural requirements, representing good practice and rules-of-thumb that go beyond explicit regulations. Evaluating the performance of data-driven architectural design models is challenging due to the nascent and opaque nature of these approaches. Existing generic evaluation metrics for image generation are not effective in assessing compliance with domain-specific design performance requirements. Generating multiple design options manually during the early design phases is repetitive, redundant, time-consuming, and makes it impossible to review a large number of options without automation. (2) Architects lack tools to rapidly generate and evaluate numerous valid design options within limited timeframes. Existing rule-based CAD systems lack creative flexibility for complex design challenges, while state-of-the-art generative design models often lack explicit mechanisms for controllability and transparency, making it difficult to align generated layouts with specific design intentions. There's an increasing need for adaptive models capable of capturing spatial hierarchies and relationships dynamically, without rigid predefined rules. (3) Current approaches in architecture lack computational frameworks that systematically integrate psychological and visual preferences, particularly regarding window views, into the design process. Window design has often prioritized factors other than occupant view quality. Quantifiable, multi-view, and context-sensitive optimization methods for window views remain underexplored. Existing performance standards often treat view quality as a secondary consideration. There's a gap in explicitly incorporating occupant viewpoint-based spatial experience (e.g., views of greenery and sky) into window design optimization objectives.
  
  In order to address the challenges: (1) the first research highlights a critical gap in data-driven generative design models, particularly those utilizing deep learning, by demonstrating their limitations in adhering to implicit architectural rules-of-thumb concerning spatial organization, privacy, and connectivity as understood and applied by professional architects. Recognizing these limitations in existing generative approaches, (2) the second research introduces RL-Plan, a novel floor plan generation model based on Deep Reinforcement Learning, specifically designed to address these shortcomings by dynamically incorporating spatial hierarchies, functional adjacencies, and domain-specific architectural knowledge into the design process to generate more contextually aware and topologically sound layouts. Expanding the focus beyond internal spatial configurations, (3) the third research tackles the crucial aspect of occupant well-being by presenting WELLView, a 3D computational framework for optimizing window design, which integrates real-world urban data to maximize occupants' access to restorative natural views, an element often neglected by automated design tools that primarily focus on interior layouts. Thus, this dissertation forms a coherent investigation into enhancing computational architectural design by first evaluating and then advancing methods for generating intelligent spatial layouts and optimizing the crucial visual connection with the external environment, ultimately aiming to create more human-centered and well-being-focused built spaces.
  
  The contributions of this research include (a) Advancement of Data-Driven Architectural Design: Providing insights into the ability of current and novel computational models to learn and apply implicit architectural knowledge and human-centric design principles; (b) Introduced an AI companion to architects, the DRL-based floor plan generator (RL-PLAN) that which enables the generation of floor plans that balance human-centric spatial design principles with functional requirements and outperforms state of the art models and architects; (c) a well-being-oriented view optimization method (WELLView) that uses real-world urban data to quantify view content while optimizing window layouts individually, monolithically, or in mixed patterns across façades. Practical implications of this research include: (a) improved design automation workflows, enhancing the efficiency of the early design phases by providing automated tools for generating and evaluating a wider range of design options that consider both functional requirements and environmental quality; (b) evidence-based design insights, providing quantifiable evidence on the impact of design decisions (e.g., floor plan layout, window placement) on implicit architectural principles and occupant well-being (e.g., privacy, access to nature), (c) bridging the gap between ai and architectural practice, offering insights and tools that can help bridge the gap between the capabilities of AI-driven design tools and the nuanced decision-making processes of human architects, and (d) enhanced occupant well-being and property value, demonstrating methods to optimize window views to maximize exposure to restorative natural elements, potentially leading to improved occupant well-being and enhanced property value."
  pp:
    pp1: "Park, K., and Ergan, S. (2025). “Quantification of the impact of street design features on restorative quality in urban settings.” Elsevier Sustainable Cities and Society, 121(March), 106216. DOI: https://doi.org/10.1016/j.scs.2025.106216. IF:10.5. SCIE."
    pp2: " Park, K., Ergan, S., and Chen, F. (2024). “Quality assessment of residential layout designs generated by relational Generative Adversarial Networks (GANs).” Automation in Construction, 158, 105243. DOI: https://doi.org/10.1016/j.autcon.2023.105243. IF: 10.3, SCI. Faculty collaborator: C. Feng from NYU."
    pp3: "Park, K., and Ergan, S. (2024). “An approach for domain-informed generative architectural design.” ASCE International Conference on Computing in Civil Engineering (i3CE), Pittsburgh, PA, July 28-31, 2024.  (Also won the Best Poster award)."
  highlight: 1

- title: "A computer vision-based approach for urban façade inspections"
  image: prj10_beyza.png
  addr: cv-facade-inspection
  description: "Evaluating façade conditions in urban settings is an integral part of the building maintenance and ensuring public safety. In current practice, façade inspections are conducted manually and visually by inspectors causing costly and time-consuming processes that are prone to errors. This project aims to automate façade inspections and present more effective methods by leveraging drones, laser scanners and computer vision &amp; AI. The objectives of the study include (1) acquisition of data for defect classification and 3D model generation (2) identifying targeted façade defects with different geometries and attributes using deep learning techniques (3) visualizing the identified defects on generated 3D models to support inspection process."
  pp:
    pp1: "Kiper, B., Xu, W., Dey, N., and Ergan, S. (2025). “Leveraging large language models (LLM) and machine learning for extracting conditions that impact safety rating of building façades.” ASCE International Conference on Computing in Civil Engineering (i3CE), Baton Rouge, Louisiana, May 11-14, 2025."
    pp2: "Kiper, B., Dey, N., Azad, A., and Ergan, S. (2024).  “Evaluating GAN models for generating images of defective façades.” ASCE International Conference on Computing in Civil Engineering (i3CE), Pittsburgh, PA, July 28-31, 2024."
    pp3: "Kiper, B., Gokhale, S., and Ergan, S. (2023). “Generative Adversarial Network (GAN) based data augmentation for enhancing DL models on façade defect identification.” Proceedings of ASCE International Conference on Computing in Civil Engineering, i3CE, June 25-28, 2023, Corvallis, Oregon, pp. 202-209. DOI: https://doi.org/10.1061/9780784485224.025."
    pp4: "Kiper, B., and Ergan, S. (2023). “The effectiveness of data augmentation methods in multi-defect classifications from façade images using transfer learning.” Proceedings of the 30th EG-ICE: International Conference on Intelligent Computing in Engineering, July 4-7, 2023, London, UK. Available at: https://www.ucl.ac.uk/bartlett/construction/sites/ bartlett_construction/files/the_effectiveness_of_data_augmentation_methods_in_multi-defect.pdf."
    pp5: "Kiper, B., Lin, X., Owoborode, M., Ergan, S., (2022). “An approach to generate point cloud-based defects for automated façade inspections.” In International Conference on Construction Applications of Virtual Reality (CONVR2022), November 16-19, 2022, Seoul, South Korea."

- title: "Risk-informed vehicle trajectory prediction for autonomous driving"
  image: prj11_Xinyi.JPG
  addr: trajectory-prediction
  description: "Accurate and reliable vehicle trajectory prediction is essential for safe and efficient autonomous driving in complex traffic environments. While existing methods typically focus on modeling historical motion patterns and social interactions, they often overlook the potential risks posed by uncertain or aggressive behaviors of surrounding agents. This study proposes a novel future risk-informed trajectory prediction framework that incorporates a risk potential field to assess perceived risks arising from nearby vehicles and road context. The framework integrates an LSTM-based motion encoder and a multi-head attention-based spatial-temporal encoder. A risk-specific feature fusion decoder is introduced to embed the risk potential field into the extracted spatial-temporal feature representations for multi-modal trajectory prediction. The proposed framework provides interpretable, risk-aware predictions, contributing to more robust planning and decision-making in autonomous driving systems."
  pp:
    pp1: "Ning, X., Bian, Z., Ozbay, K., and Ergan, S. (2025). “STRAP: Spatial-temporal risk-attentive vehicle trajectory prediction for autonomous driving.” IEEE 28th International Conference on Intelligent Transportation Systems (ITSC 2025),  November 18-21, 2025, Gold Coast, Australia. (accepted)"
  highlight: 1